<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Education Timeline">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Timeline Central Bar -->
  <rect x="100" y="120" width="600" height="6" rx="3" fill="url(#barGrad)" opacity="0.3"/>
  <rect x="100" y="120" width="300" height="6" rx="3" fill="url(#barGrad)"/>

  <!-- Pulse light on the timeline bar -->
  <circle cx="400" cy="123" r="5" fill="#00F2FE">
    <animate attributeName="cx" values="100;700;100" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: Little Flower Junior College -->
  <g transform="translate(250, 123)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="22" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="10" fill="#090d16" stroke="#0072ff" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#00F2FE"/>
    
    <!-- Info Box Above -->
    <g transform="translate(0, -90)">
      <rect x="-120" y="0" width="240" height="65" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">Little Flower Junior College</text>
      <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Intermediate (MPC) - 92.9%</text>
      <text x="0" y="48" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#00C6FF" text-anchor="middle">2021 - 2023</text>
    </g>
  </g>

  <!-- Node 2: VIT AP University -->
  <g transform="translate(550, 123)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="22" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="10" fill="#090d16" stroke="#00F2FE" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#00F2FE"/>
    
    <!-- Info Box Below -->
    <g transform="translate(0, 25)">
      <rect x="-130" y="0" width="260" height="65" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">Vellore Institute of Technology, AP</text>
      <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">B.Tech CSE (AI &amp; ML Spec) - 8.33 GPA</text>
      <text x="0" y="48" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#00F2FE" text-anchor="middle">2023 - 2027 (Expected)</text>
    </g>
  </g>

</svg>